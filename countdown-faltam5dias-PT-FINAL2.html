<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Countdown - Faltam 5 dias (PT)</title>
<style>
  /* ====== CONFIGURACAO RAPIDA ======
     1) Cor da fonte do contador: mude --font-color
     2) Data/hora final do evento: mude TARGET_DATE no <script>
        (ja fixado para 21/09/2026, 10h, horario de Brasilia)
     3) Posicao da caixa demarcada na arte, em % da imagem total
        (7681 x 785 px): x 1409-3610, y 144-638
     ================================== */
  :root {
    --font-color: #FFFFFF;

    --box-left: 18.34%;
    --box-top: 18.34%;
    --box-width: 28.66%;
    --box-height: 62.93%;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  .banner-wrap {
    position: relative;
    width: 100%;
    max-width: 7681px;
    aspect-ratio: 7681 / 785;
  }

  .banner-wrap img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .countdown-overlay {
    position: absolute;
    left: var(--box-left);
    top: var(--box-top);
    width: var(--box-width);
    height: var(--box-height);
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--font-color);
  }

  .countdown-overlay .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    margin: 0 0.55vw;
  }

  .countdown-overlay .unit .value {
    font-weight: bold;
    font-size: 2.6vw;
    font-variant-numeric: tabular-nums;
  }

  .countdown-overlay .unit .label {
    font-weight: normal;
    font-size: 0.68vw;
    text-transform: uppercase;
    letter-spacing: 0.04vw;
    margin-top: 0.35vw;
    opacity: 0.9;
  }

  .countdown-overlay .sep-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    margin: 0 0.15vw;
  }

  .countdown-overlay .sep {
    font-weight: bold;
    font-size: 2.6vw;
    opacity: 0.7;
  }

  .countdown-overlay .sep-spacer {
    font-size: 0.68vw;
    margin-top: 0.35vw;
    visibility: hidden;
  }

  .cta-link {
    position: absolute;
    left: 59.94%;
    top: 55.54%;
    width: 25.92%;
    height: 24.20%;
    display: block;
  }
</style>
</head>

  // ---- DATA/HORA FINAL DO EVENTO: 21/09/2026, 10h, horario de Brasilia (UTC-3) ----
  const TARGET_DATE = new Date("2026-09-21T10:00:00-03:00");

  const elDays = document.getElementById("cd-days");
  const elHours = document.getElementById("cd-hours");
  const elMinutes = document.getElementById("cd-minutes");
  const elSeconds = document.getElementById("cd-seconds");

  function pad(n) { return String(n).padStart(2, "0"); }

  function tick() {
    const now = new Date();
    let diff = TARGET_DATE - now;

    if (diff <= 0) {
      elDays.textContent = "00";
      elHours.textContent = "00";
      elMinutes.textContent = "00";
      elSeconds.textContent = "00";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    diff -= days * (1000 * 60 * 60 * 24);
    const hours = Math.floor(diff / (1000 * 60 * 60));
    diff -= hours * (1000 * 60 * 60);
    const minutes = Math.floor(diff / (1000 * 60));
    diff -= minutes * (1000 * 60);
    const seconds = Math.floor(diff / 1000);

    elDays.textContent = pad(days);
    elHours.textContent = pad(hours);
    elMinutes.textContent = pad(minutes);
    elSeconds.textContent = pad(seconds);
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
